apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-celery-worker
  labels:
    app.kubernetes.io/name: statvidya-celery
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.celery.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: statvidya-celery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statvidya-celery
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: celery-worker
          image: "{{ .Values.celery.image.repository }}:{{ .Values.celery.image.tag }}"
          imagePullPolicy: {{ .Values.celery.image.pullPolicy }}
          command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info", "-c", "4"]
          env:
            - name: CELERY_BROKER_URL
              value: "redis://{{ .Release.Name }}-redis:6379/1"
            - name: CELERY_RESULT_BACKEND
              value: "redis://{{ .Release.Name }}-redis:6379/2"
            - name: DATABASE_URL
              value: "postgresql://statvidya_admin:statvidya_secure_prod@{{ .Release.Name }}-postgres:5432/statvidya_db"
            - name: MINIO_ENDPOINT
              value: "{{ .Release.Name }}-minio:9000"
          resources:
            {{- toYaml .Values.celery.resources | nindent 12 }}
