apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    app.kubernetes.io/name: statvidya-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: statvidya-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statvidya-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          command: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: statvidya_s3_admin
            - name: MINIO_ROOT_PASSWORD
              value: statvidya_s3_prod_secret
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    app.kubernetes.io/name: statvidya-minio
spec:
  ports:
    - port: 9000
      name: s3
    - port: 9001
      name: console
  selector:
    app.kubernetes.io/name: statvidya-minio
