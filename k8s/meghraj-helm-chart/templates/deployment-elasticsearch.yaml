apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-elasticsearch
  labels:
    app.kubernetes.io/name: statvidya-elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: statvidya-elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statvidya-elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: {{ .Values.elasticsearch.securityEnabled | default false | quote }}
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-elasticsearch
  labels:
    app.kubernetes.io/name: statvidya-elasticsearch
spec:
  ports:
    - port: 9200
      name: http
  selector:
    app.kubernetes.io/name: statvidya-elasticsearch
