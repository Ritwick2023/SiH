apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: statvidya-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | default "statvidya_admin" | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "statvidya_secure_prod" | quote }}
  DATABASE_URL: "postgresql://{{ .Values.secrets.postgresUser | default "statvidya_admin" }}:{{ .Values.secrets.postgresPassword | default "statvidya_secure_prod" }}@{{ .Release.Name }}-postgres:5432/statvidya_db"
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | default "statvidya_s3_admin" | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | default "statvidya_s3_prod_secret" | quote }}
  ANALYTICS_API_SECRET: {{ .Values.secrets.analyticsApiSecret | default "statvidya_prod_analytics_secret" | quote }}
  AUTH_SECRET: {{ .Values.secrets.authSecret | default "statvidya_prod_auth_hmac_secret" | quote }}
